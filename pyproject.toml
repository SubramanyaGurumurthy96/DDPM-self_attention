[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddpm-self-attention"
version = "0.1.0"
description = "Educational PyTorch DDPM with v-prediction and bottleneck self-attention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
